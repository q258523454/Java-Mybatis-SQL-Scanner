plugins {
    id 'java'
    // 1.x 版本已经过时了
    // id 'org.jetbrains.intellij' version '1.17.0'
    // 2.20.0 起支持 IntelliJ Platform 2026.3(263) 的模块化布局, 2.13.1 无法解析其 module-descriptors
    id 'org.jetbrains.intellij.platform' version '2.20.0'
}

repositories {
    mavenCentral()
    // 注意 2.x 必须添加此仓库配置
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    // 声明对 IntelliJ IDEA 平台的依赖
    intellijPlatform {
        // intellijIdea("2024.3.7.1")
        intellijIdea("2025.1") // 已下载
        // intellijIdea("2025.3.6.2")
        // intellijIdea("2026.1") // 已下载
        // intellijIdea("2026.2.5") // 已下载
        // intellijIdea("2026.3") // 已下载
        // 2026.x 起 IDEA 发行包不再默认捆绑 Java 插件, PsiClass/PsiShortNamesCache 等 Java PSI 类必须显式声明
        bundledPlugin("com.intellij.java")
    }
    implementation 'com.alibaba:druid:1.2.8'
    implementation 'org.dom4j:dom4j:2.1.4'
    // 加载本地依赖
    implementation fileTree(dir: 'src/main/resources/libs', includes: ['*.jar'])
    // 系统
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// 测试配置：使用 JUnit 5 平台运行测试
test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            // 忽略所有的 src/main/java/test目录
            exclude 'test/**'
        }
        resources {
            // 打包忽略目录和文件
            exclude 'img/**'
            exclude 'libs/**'
            exclude 'libsource/**'
            exclude 'icons/mybatis/**'
            exclude 'icons/scanner.vsdx'
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

// 构建插件时的额外配置（禁止生成搜索选项，可缩短构建时间）
// 2.x 中需通过 intellijPlatform 扩展关闭 buildSearchableOptions,
// 否则 buildPlugin 会下载完整 IDE 发行包(dmg)来生成搜索选项索引
intellijPlatform {
    buildSearchableOptions = false

    // 显式声明插件兼容范围: 最小 2025.1(251), 最大不限制
    // 2.x 的 patchPluginXml 默认会按编译目标平台覆盖 since-build, 显式配置后可固定兼容范围
    pluginConfiguration {
        ideaVersion {
            sinceBuild = "251"
            untilBuild = provider { null }
        }
    }
}

group 'com.zhang'
version '2025.1-PLUS2'